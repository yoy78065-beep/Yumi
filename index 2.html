<style>
/* Layout: a stage with the character on one side, a chat panel on the other; stacked on phones. */
:root {
  --bg: #fff3f6;
  --panel: #ffffff;
  --panel-2: #ffe6ee;
  --fg: #3a1a2b;
  --muted: #8a5b70;
  --line: #f2c6d5;
  --accent: #e8457c;
  --accent-fg: #ffffff;
  --glow: #ffb3cd;
  --mouth: #8c2149;
  --font-display: "Pixelify Sans", "Readex Pro", ui-monospace, sans-serif;
  --font-body: "Readex Pro", "Segoe UI", Tahoma, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #170f20; --panel: #231733; --panel-2: #2e1d42; --fg: #fbe9f1; --muted: #b698ad;
    --line: #432a5c; --accent: #ff6fa3; --accent-fg: #2a0b1a; --glow: #6a2a63; --mouth: #7a1d41;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #170f20; --panel: #231733; --panel-2: #2e1d42; --fg: #fbe9f1; --muted: #b698ad;
  --line: #432a5c; --accent: #ff6fa3; --accent-fg: #2a0b1a; --glow: #6a2a63; --mouth: #7a1d41;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
#app { height: 100%; display: grid; grid-template-columns: minmax(300px, 44%) 1fr; gap: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; }
.stage { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px; padding: 8px; overflow: hidden;
  background: radial-gradient(60% 55% at 50% 62%, var(--glow), transparent 70%); border-radius: 18px; }
.nameplate { position: absolute; top: 10px; inset-inline-start: 12px; display: flex; align-items: center; gap: 8px; z-index: 3; }
.nameplate input { width: 9ch; font: 700 20px var(--font-display); color: var(--fg); background: transparent; border: 0; border-bottom: 2px dashed transparent; padding: 0 2px; }
.nameplate input:hover, .nameplate input:focus { border-bottom-color: var(--accent); outline: none; }
.dot { width: 9px; height: 9px; background: #3ddc84; border-radius: 1px; box-shadow: 0 0 0 2px color-mix(in srgb, #3ddc84 30%, transparent); }
.dot.off { background: var(--muted); box-shadow: none; }
.bubble { position: relative; z-index: 3; align-self: stretch; margin-top: 44px; max-height: 34%; overflow: auto; background: var(--panel); border: 2px solid var(--accent); border-radius: 14px; padding: 10px 14px; font-size: 15px; min-height: 48px; }
.bubble::after { content: ""; position: absolute; bottom: -9px; left: 50%; width: 14px; height: 14px; background: var(--panel); border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: translateX(-50%) rotate(45deg); }
.bubble .who { display: block; font: 600 11px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
.char { position: relative; height: min(62vh, 620px); aspect-ratio: 420 / 737; max-width: 100%; cursor: pointer; flex: 0 1 auto; min-height: 0; }
.char .rig { position: absolute; inset: 0; transform-origin: 50% 100%; animation: bob 3.2s ease-in-out infinite; }
.char .sprite { position: absolute; inset: 0; width: 100%; height: 100%; transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
.char img { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
#fa { animation: fa 1.2s steps(1) infinite; }
#fb { visibility: hidden; animation: fb 1.2s steps(1) infinite; }
.char.talking #fa { animation-duration: .6s; }
.char.talking #fb { animation-duration: .6s; }
@keyframes fa { 0% { visibility: visible } 50% { visibility: hidden } }
@keyframes fb { 0% { visibility: hidden } 50% { visibility: visible } }
@keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-2.2%) } }
@keyframes breathe { 0%, 100% { transform: scale(1, 1) } 50% { transform: scale(1.008, 1.014) } }
.mouth { position: absolute; left: 41.2%; top: 31.3%; width: 4.6%; height: 2.4%; transform: translate(-50%, -50%) scaleY(0); border-radius: 50%; background: var(--mouth); border: 2px solid #e65a7e; opacity: 0; transition: opacity .08s; }
.char.talking .mouth { opacity: 1; animation: talk .32s steps(1) infinite; }
@keyframes talk { 0% { transform: translate(-50%, -50%) scaleY(.25) } 25% { transform: translate(-50%, -50%) scaleY(1) } 50% { transform: translate(-50%, -50%) scaleY(.5) } 75% { transform: translate(-50%, -50%) scaleY(.9) } }
.shadow { width: 46%; height: 14px; background: radial-gradient(closest-side, rgba(60, 10, 40, .35), transparent); animation: sh 3.2s ease-in-out infinite; margin-top: -6px; }
@keyframes sh { 0%, 100% { transform: scaleX(1); opacity: .9 } 50% { transform: scaleX(.88); opacity: .6 } }
.char { perspective: 900px; }
.sprite.a-stretch { animation: a-stretch 1.5s ease-in-out; }
@keyframes a-stretch { 0%,100% { transform: scale(1,1) } 25% { transform: scale(.93,1.16) rotate(-1.5deg) } 60% { transform: scale(.93,1.16) rotate(1.5deg) } }
.sprite.a-squish { animation: a-squish .9s ease-out; }
@keyframes a-squish { 0%,100% { transform: scale(1,1) } 20% { transform: scale(1.14,.84) } 50% { transform: scale(.95,1.08) } 75% { transform: scale(1.04,.97) } }
.rig.a-jump { animation: a-jump .9s cubic-bezier(.3,0,.4,1); }
@keyframes a-jump { 0%,100% { transform: translateY(0) scale(1,1) } 15% { transform: translateY(0) scale(1.1,.88) } 50% { transform: translateY(-14%) scale(.95,1.07) } 85% { transform: translateY(0) scale(1.08,.9) } }
.sprite.a-wiggle { animation: a-wiggle 1s ease-in-out; }
@keyframes a-wiggle { 0%,100% { transform: rotate(0) } 15% { transform: rotate(-5deg) } 35% { transform: rotate(5deg) } 55% { transform: rotate(-4deg) } 75% { transform: rotate(4deg) } }
.rig.a-spin { animation: a-spin 1.1s ease-in-out; }
@keyframes a-spin { 0%,100% { transform: translateY(0) rotateY(0) } 50% { transform: translateY(-8%) rotateY(180deg) } }
.sprite.a-shy { animation: a-shy 1.8s ease-in-out; }
@keyframes a-shy { 0%,100% { transform: rotate(0) scale(1) } 25%,75% { transform: rotate(-7deg) scale(.96) translateX(-2%) } }
.sprite.a-sleepy { animation: a-sleepy 2.6s ease-in-out; }
@keyframes a-sleepy { 0%,100% { transform: rotate(0) scale(1) } 40%,70% { transform: rotate(7deg) scale(.98,.95) translateY(2%) } }
.sprite.a-wave { animation: a-wave 1.4s ease-in-out; }
@keyframes a-wave { 0%,100% { transform: rotate(0) } 15% { transform: rotate(8deg) } 35% { transform: rotate(-3deg) } 55% { transform: rotate(8deg) } 75% { transform: rotate(-3deg) } }
.rig.a-happy { animation: a-happy 1.3s ease-in-out; }
@keyframes a-happy { 0%,40%,80%,100% { transform: translateY(0) rotate(0) } 20% { transform: translateY(-9%) rotate(-3deg) } 60% { transform: translateY(-9%) rotate(3deg) } }
.zz { position: absolute; font: 700 18px var(--font-display); color: var(--accent); animation: rise 1.8s ease-out forwards; }
.topbtns { position: absolute; top: 10px; inset-inline-end: 12px; z-index: 3; display: flex; gap: 6px; }
.langbtn { font: 600 12px var(--font-body); background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.langbtn:hover { border-color: var(--accent); }
[dir="ltr"] .msg.me { align-self: flex-end; border-end-start-radius: 14px; border-end-end-radius: 4px; }
[dir="ltr"] .msg.bot { align-self: flex-start; border-end-end-radius: 14px; border-end-start-radius: 4px; }
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(20, 8, 30, .55); display: grid; place-items: center; padding: 16px; }
.card { width: min(94vw, 440px); max-height: 92vh; overflow: auto; background: var(--panel); border: 2px solid var(--accent); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.card h2 { margin: 0; font: 700 20px var(--font-display); }
.card label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.card input, .card select { font: 400 16px var(--font-body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; width: 100%; }
.card .row { display: flex; gap: 8px; justify-content: flex-end; }
.card .btn { font: 600 14px var(--font-body); border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer; background: var(--panel-2); color: var(--fg); }
.card .btn.primary { background: var(--accent); color: var(--accent-fg); }
.card .hint { font-size: 12px; color: var(--muted); }
.char { touch-action: manipulation; }
.fx { position: absolute; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
.heart { position: absolute; width: 14px; height: 13px; background: var(--accent); clip-path: polygon(0 25%, 25% 0, 50% 25%, 75% 0, 100% 25%, 100% 55%, 50% 100%, 0 55%); animation: rise 1.4s ease-out forwards; }
@keyframes rise { from { transform: translateY(0) scale(.6); opacity: 1 } to { transform: translateY(-110px) scale(1.2); opacity: 0 } }

.chat { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 0 0 0 14px; }
[dir="rtl"] .chat { padding: 0 14px 0 0; }
.log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px; }
.msg { max-width: 88%; padding: 8px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me { align-self: flex-start; background: var(--accent); color: var(--accent-fg); border-end-start-radius: 4px; }
.msg.bot { align-self: flex-end; background: var(--panel); border: 1px solid var(--line); border-end-end-radius: 4px; }
.msg.me img { display: block; max-width: 160px; border-radius: 8px; margin-bottom: 6px; }
.empty { margin: auto; text-align: center; color: var(--muted); max-width: 32ch; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font: 400 13px var(--font-body); background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.composer { display: flex; align-items: flex-end; gap: 8px; background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 6px; }
.composer:focus-within { border-color: var(--accent); }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 0; background: transparent; color: var(--fg); font: 400 15px/1.5 var(--font-body); padding: 6px 8px; max-height: 120px; outline: none; }
.ibtn { flex: none; width: 38px; height: 38px; border-radius: 12px; border: 0; background: var(--panel-2); color: var(--fg); cursor: pointer; display: grid; place-items: center; }
.ibtn:hover { background: var(--line); }
.ibtn.on { background: var(--accent); color: var(--accent-fg); }
.ibtn svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.send { background: var(--accent); color: var(--accent-fg); }
.send:hover { background: var(--accent); filter: brightness(1.08); }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { font-size: 12px; color: var(--muted); }
.thumb { display: none; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.thumb.show { display: flex; }
.thumb img { height: 36px; border-radius: 6px; }
.thumb button { border: 0; background: none; color: var(--accent); cursor: pointer; font: inherit; }

@media (max-width: 760px) {
  #app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 52%) minmax(0, 1fr); gap: 8px; }
  .chat, [dir="rtl"] .chat { padding: 0; }
  .char { height: min(36vh, 320px); }
  .bubble { margin-top: 36px; max-height: 40%; font-size: 14px; }
  .stage { flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) {
  .char .rig, .char .sprite, .shadow, #fa, #fb, .char.talking .mouth { animation: none !important; }
  #fa { visibility: visible; } #fb { visibility: hidden; }
}
</style>
